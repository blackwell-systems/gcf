name: differential-fuzz

# Cross-SDK differential fuzz (testing.md layer 4a). Builds all six SDK CLIs
# side by side and asserts byte-identical encode + idempotent decode across them
# on adversarial random input. This is heavy (six toolchains, six builds), so it
# runs nightly and on demand rather than on every push.

on:
  schedule:
    - cron: '0 7 * * *'   # nightly, ~07:00 UTC
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Iterations per seed (DIFF_N)'
        default: '5000'
      seeds:
        description: 'Space-separated seeds'
        default: '1 2 3'

permissions:
  contents: read

concurrency:
  group: differential-fuzz
  cancel-in-progress: true

jobs:
  differential:
    # macOS so Swift and the other five toolchains all install on one runner.
    runs-on: macos-14
    steps:
      - name: Checkout gcf
        uses: actions/checkout@v4
        with:
          path: gcf
      # The six SDK repos are checked out as siblings of gcf, the layout
      # scripts/differential-fuzz.py resolves by default. If these repos are
      # private, set the GCF_CI_TOKEN secret to a PAT with read access; for
      # public repos the default job token is sufficient.
      - name: Checkout gcf-go
        uses: actions/checkout@v4
        with: { repository: blackwell-systems/gcf-go, path: gcf-go, token: '${{ secrets.GCF_CI_TOKEN || github.token }}' }
      - name: Checkout gcf-rust
        uses: actions/checkout@v4
        with: { repository: blackwell-systems/gcf-rust, path: gcf-rust, token: '${{ secrets.GCF_CI_TOKEN || github.token }}' }
      - name: Checkout gcf-python
        uses: actions/checkout@v4
        with: { repository: blackwell-systems/gcf-python, path: gcf-python, token: '${{ secrets.GCF_CI_TOKEN || github.token }}' }
      - name: Checkout gcf-typescript
        uses: actions/checkout@v4
        with: { repository: blackwell-systems/gcf-typescript, path: gcf-typescript, token: '${{ secrets.GCF_CI_TOKEN || github.token }}' }
      - name: Checkout gcf-kotlin
        uses: actions/checkout@v4
        with: { repository: blackwell-systems/gcf-kotlin, path: gcf-kotlin, token: '${{ secrets.GCF_CI_TOKEN || github.token }}' }
      - name: Checkout gcf-swift
        uses: actions/checkout@v4
        with: { repository: blackwell-systems/gcf-swift, path: gcf-swift, token: '${{ secrets.GCF_CI_TOKEN || github.token }}' }

      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - name: Build go CLI
        run: cd gcf-go && go build -o gcf ./cmd/gcf
      - name: Build rust CLI
        run: cd gcf-rust && cargo build --release
      - name: Build TypeScript CLI
        run: cd gcf-typescript && npm ci && npm run build
      - name: Build Kotlin CLI
        run: cd gcf-kotlin && ./gradlew --no-daemon installDist
      - name: Build Swift CLI
        run: cd gcf-swift && swift build -c release
      # Python needs no build; the script runs `python -m gcf` with PYTHONPATH=src.

      - name: Run differential fuzz
        env:
          ITER: ${{ github.event.inputs.iterations || '5000' }}
          SEEDS: ${{ github.event.inputs.seeds || '1 2 3' }}
        run: |
          cd gcf
          fail=0
          for s in $SEEDS; do
            echo "::group::seed $s (DIFF_N=$ITER)"
            DIFF_SEED="$s" DIFF_N="$ITER" python3 scripts/differential-fuzz.py || fail=1
            echo "::endgroup::"
          done
          exit $fail
